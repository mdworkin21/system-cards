name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: lint, types, tests, data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run syscards schema --check
      - name: check sources (quotes unverified here; PDFs are not in the repo)
        run: uv run syscards check --quiet

  changes:
    name: detect site changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On a push, compare with the branch's previous head rather than itself.
          base: ${{ github.ref_name }}
          filters: |
            site:
              - 'site/**'
              - 'schema/**'
              - '.github/workflows/**'

  site:
    name: site (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: generated types match the schema export
        run: npm run gen-types && git diff --exit-code src/types.generated.ts
      - name: no lab name in site/src
        run: '! grep -rEinw "$(ls ../sources | paste -sd"|" -)" src --exclude=types.generated.ts'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  hooks:
    name: Claude hooks (parser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/hooks/test_branchlib.py

  quotes:
    name: fetch documents and verify every quote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run syscards fetch-all
      - run: uv run syscards check --require-pdfs
