  - name: Claude Fable 5.1
    developer: Anthropic
    family: Claude 5
    release_date: "2026-09"
    open_weights: false
  - name: Claude Mythos 5.1
    developer: Anthropic
    family: Claude 5
    release_date: "2026-09"
    open_weights: false
