# System Card: Claude Fable 5.1 & Claude Mythos 5.1, September 1, 2026.
# One document, two deployment configurations of one model with identical
# weights. Fable 5.1 adds safeguards for general availability; Mythos 5.1 is
# the same model with more permissive safeguards for vetted access. Page
# numbers are physical PDF pages, which match the printed numbers here.
id: anthropic/claude-fable-5.1-mythos-5.1/2026-09
