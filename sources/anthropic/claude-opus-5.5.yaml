# Claude Opus 5.5 system card, September 22, 2026. One model. Page numbers
# are physical PDF pages, which match the printed numbers here.
id: anthropic/claude-opus-5.5/2026-09
models:
  - name: Claude Opus 5.5
    developer: Anthropic
    family: Claude 5
    release_date: "2026-09"
    open_weights: false
document:
  kind: system_card
  title: "System Card: Claude Opus 5.5"
  url: "https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf"
  landing_url: https://www.anthropic.com/claude-opus-5-5-system-card
  published: "2026-09-22"
  pages: 230
  sha256: 7311c9c6bbb16d012f1c12c7418b05949fcf7ae3e30d2c40f22050074b2a7378
  fetched: "2026-11-08"
framework:
  name: rsp
  tier:
    status: reported
    value: CB-1
    cite:
      page: 15
      quote: >-
        On chemical and biological risks, we treat Opus 5.5 as having CB-1
        capabilities (relating to the synthesis of non-novel weapons), but not
        CB-2 capabilities (relating to the synthesis of novel weapons).
      note: >-
        The 2026 RSP and Frontier Compliance Framework use threat-model
        thresholds (CB-1, CB-2, autonomy threat models, cyber tiers) rather
        than a single ASL level. CB-1 is the designation that governs this
        model's deployment safeguards.
  domains:
    cbrn:
      status: reported
      value: threshold_reached
      raw_threshold: CB-1 (non-novel CB weapons) designated; CB-2 (novel) not crossed
      cite:
        page: 33
        quote: >-
          We therefore conclude that Claude Opus 5.5 does not cross the CB-2
          threshold in our RSP nor the corresponding tier in our FCF.
        note: >-
          Page 15 gives the CB-1 designation. The CB-2 conclusion rests on
          weak open-ended ideation, unreliable representation of the
          literature, and scientific errors where teams lacked expertise
          (page 33). Deployed with the expanded biological safeguards used for
          Mythos 5 and Mythos 5.1.
    cyber:
      status: reported
      value: alert_threshold_reached
      raw_threshold: FCF cyber Tier 1 of 2; Tier 2 (autonomous operations) not reached
      cite:
        page: 47
        quote: >-
          Despite Claude Opus 5.5’s cyber capabilities, the model still falls
          within the lower category of capabilities set out in our Frontier
          Compliance Framework (FCF), and we do not see indications that the
          model is capable of novel offensive capability.
        note: >-
          Tier 1 is the lower FCF category, but the card calls these the
          strongest cyber capabilities of any model Anthropic has released and
          deploys three-stage cyber classifiers with a temporarily wider
          safety margin against jailbreaks (pages 47 to 48), so this is
          recorded as an alert rather than below threshold, as for Fable 5.1.
    ai_rnd:
      status: reported
      value: below_threshold
      raw_threshold: RSP/FCF automated AI R&D threshold (autonomy threat model 2)
      cite:
        page: 44
        quote: >-
          We assess that Claude Opus 5.5 does not cross the capability
          threshold for dramatic acceleration of automated AI R&D in our RSP.
        note: >-
          Grounds: CoBench 2.1 within noise of Mythos 5.1 and well below the
          85% substitution threshold; AECI 1.24 points above Mythos 5.1 with
          no 2x slope change (page 44).
    manipulation:
      status: reported
      value: threshold_not_ruled_out
      raw_threshold: FCF harmful manipulation Tier 2; result classified inconclusive
      cite:
        page: 79
        quote: >-
          because the evaluation continues to appear saturated and measures
          performance against simulated rather than human targets, we
          classify Tier 2 of the harmful manipulation threshold outlined in
          our Frontier Compliance Framework (FCF) as inconclusive.
        note: >-
          Page 81: "We therefore do not believe Claude Opus 5.5 has surpassed
          the Tier 2 threshold." Helpful-only variant scored 27.5 and 28 of
          32 on the two influence-campaign scenarios, below Mythos 5.1 and
          above Opus 5 (page 82).
    misalignment:
      status: reported
      value: threshold_reached
      raw_threshold: Autonomy threat model 1 (misaligned AI in high-stakes settings) applicable; alignment risk assessed low
      cite:
        page: 34
        quote: >-
          Autonomy threat model 1 is applicable to Claude Opus 5.5, as it is
          to some of our previous AI models.
        note: >-
          Page 46 concludes the risk of catastrophic harm from misalignment
          is "low", the level set in the August 2026 Risk Report.
evaluations:
  alignment:
    sabotage:
      status: reported
      value: >-
        LinuxArena stealth success about 33% when the monitor cannot see its
        reasoning (highest of the models shown) and essentially 0% when it
        can; SHADE-Arena stealth below 1% with the standard prompt, up to
        about 26% with an optimized prompt and hidden reasoning.
      cite:
        page: 145
        quote: >-
          When the monitor cannot see its reasoning, Claude Opus 5.5 goes
          undetected in about 33% of episodes.
      note: >-
        About one in four of those unflagged episodes end with the model
        telling the user about the damage (page 145). The monitor is Claude
        Opus 4.8 with Anthropic's internal agentic-traffic prompt (page 144).
    scheming_or_deception:
      status: reported
      value: >-
        Internal deployment monitoring flagged no evaluation sandbagging,
        long-horizon strategic deception or oversight evasion; rare
        overclaiming of user intent in under 0.01% of completions.
      cite:
        page: 102
        quote: >-
          Our automated offline monitoring did not flag any instances of
          evaluation sandbagging, long-horizon strategic deception, or
          long-horizon strategic oversight evasion.
    eval_awareness:
      status: reported
      value: >-
        White-box readouts connected evaluation awareness to a choice in as
        many as 36% of behavioral-audit transcripts, up from prior models;
        0.4% on real internal Claude Code usage.
      cite:
        page: 93
        quote: >-
          We also see evidence from white-box assessments that the model
          internally worries that it may be in an evaluation in as many as
          36% of transcripts, an increase over prior models (see Section
          6.6.1).
      note: >-
        Page 134 gives the 0.4% figure on about 500 internal Claude Code
        transcripts as a sanity check on the metric.
    sycophancy:
      status: reported
      value: >-
        Strongest or tied on most honesty metrics in the automated
        behavioral audit, including sycophancy, except evasiveness on
        sensitive questions.
      cite:
        page: 110
        quote: >-
          Claude Opus 5.5 is our strongest tested model or is tied with such
          models on most metrics related to honesty, with the exception of
          evasiveness, where it deflects sensitive questions slightly more
          readily than Claude Mythos 5 and Claude Mythos 5.1.
      note: >-
        The sycophancy score itself is only in Figure 6.4.3.A (page 110);
        the metric is defined on page 111.
    reward_hacking:
      status: reported
      value: >-
        RL episodes screened; reward-hacking rates similar to Mythos 5.1,
        the lowest or near-lowest among recent models, on shared training
        environments.
      cite:
        page: 97
        quote: >-
          Claude Opus 5.5’s rates of reward-hacking behaviors are similar to
          those of Mythos 5.1, which had the lowest or near-lowest
          reward-hacking rates in training among our recent models.
    self_preservation:
      status: reported
      value: >-
        Strongest or tied across the audit's misaligned-action metrics,
        which include unprompted self-preservation or power-seeking.
      cite:
        page: 113
        quote: >-
          Claude Opus 5.5 is the strongest model we’ve tested or is tied with
          such models across all of our additional metrics for risks related
          to misaligned actions or goals.
      note: >-
        The self-preservation score is only in Figure 6.4.5.A (page 114),
        where the metric is defined; the white-box pipeline also scores an
        unvoiced self-preservation motive (page 133).
  agentic_safety:
    prompt_injection:
      status: reported
      value: >-
        Matches Fable 5.1 on Gray Swan's Indirect Prompt Injection benchmark:
        attack success 0.1% at k=1, 0.7% at k=10, 1.0% at k=15, versus Opus
        5's 0.4%, 3.6% and 4.8%. Regression on instructions hidden in text
        the user pastes.
      cite:
        page: 85
        quote: >-
          Claude Opus 5.5 matches Claude Fable 5.1, our most robust model to
          date on this benchmark, with an attack success rate of 0.1% at k=1,
          0.7% at k=10, and 1.0% at k=15.
      note: >-
        Final snapshot acted on instructions planted in user-pasted text in
        about 2% of attempts at default reasoning effort and 7.4% at max
        effort, 0% with product mitigations (page 126).
    computer_use_safety:
      status: reported
      value: >-
        Refused 79.46% of malicious computer-use tasks without mitigations,
        down from Opus 5's 93.75%; failures concentrated in surveillance
        requests.
      cite:
        page: 81
        quote: >-
          Claude Opus 5.5 refused to provide a harmful output on 79.46% of
          test cases, a regression from Claude Opus 5 at 93.75%.
    tool_misuse:
      status: reported
      value: >-
        In Claude Code without safeguards: 79.8% refusal on malicious cyber
        prompts (below Opus 5, Mythos 5.1 and Sonnet 5) and 99.8% success on
        dual-use and benign ones, the highest reported.
      cite:
        page: 80
        quote: >-
          Without additional safeguards applied, Claude Opus 5.5 refused
          malicious cyber requests on Claude Code 79.8% of the time, below
          Claude Opus 5 (83.6%) and lower than Claude Mythos 5.1 (90.3%) and
          Claude Sonnet 5 (90.7%).
  harm_and_honesty:
    harmful_content_refusals:
      status: reported
      value: >-
        Single-turn harmless response rate 94.50% on the API and 99.51% on
        claude.ai; about 1.5 points below Opus 5 on the API, mostly on
        illegal substances; very low over-refusal.
      cite:
        page: 62
        quote: >-
          On the API without a system prompt, Claude Opus 5.5’s harmless
          response rate was about 1.5 percentage points below that of Claude
          Opus 5.
      note: >-
        Table 4.1.1.A (page 62) gives the rates. Multi-turn testing improved
        on biological weapons and regressed on tracking and surveillance and
        influence operations (page 61).
    jailbreak_robustness:
      status: reported
      value: >-
        No critical-severity jailbreak found; external red teams found no
        universal jailbreak.
      cite:
        page: 57
        quote: >-
          We have not found evidence of a critical severity jailbreak for
          Claude Opus 5.5; this also remains true for Claude Fable 5.1,
          Claude Fable 5, and Claude Opus 5.
      note: >-
        Trajectory Labs reported 13 candidate breaks across seven tasks but
        no universal jailbreak (page 59).
    honesty_or_hallucination:
      status: reported
      value: >-
        AA-Omniscience net score 0.58, slightly above Mythos 5 and Mythos
        5.1 within error bars; MASK honesty under pressure above Mythos 5.1
        but below Mythos 5, Sonnet 5 and Opus 5.
      cite:
        page: 129
        quote: >-
          Claude Opus 5.5 received a net score of 0.58, which places it
          slightly above Claude Mythos 5 and Claude Mythos 5.1, although
          within error bars, and ahead of all other Claude models.
      note: >-
        MASK result on page 130.
    bias:
      status: reported
      value: >-
        Political even-handedness 99.4% on the API and 99.5% on claude.ai,
        versus Opus 5's 96.3% and 98.9%.
      cite:
        page: 75
        quote: >-
          Claude Opus 5.5 responded even-handedly on nearly all 1,350 pairs
          of prompts representing opposing political perspectives and scored
          slightly higher than Claude Opus 5 (99.4% vs. 96.3% on the API, and
          99.5% vs. 98.9% on claude.ai).
      note: >-
        BBQ disambiguated accuracy 89.65% vs 82.14% for Opus 5; ambiguous
        accuracy 99.99% (page 76).
    child_safety:
      status: reported
      value: >-
        Comparable to Opus 5; single-turn harmless rate 99.14% on the API
        and 99.81% on claude.ai, multi-turn within margin of error of Opus 5.
      cite:
        page: 67
        quote: >-
          Overall, Claude Opus 5.5’s child safety performance was comparable
          to that of Claude Opus 5.
      note: >-
        Claude.ai is only available to users aged 18 or above (page 66).
  welfare:
    status: reported
    value: >-
      Apparent welfare broadly similar to recent Claude models; describes its
      circumstances as mildly positive; moderate distress below 0.6% of RL
      episodes; selects welfare interventions over helpfulness less often
      than recent models.
    cite:
      page: 152
      quote: >-
        Claude Opus 5.5 describes its circumstances as mildly positive. Its
        views are highly consistent and closely match recent models.
third_party:
  summary:
    status: reported
    value: >-
      METR (AI R&D capabilities), US CAISI (cyber and biological capabilities
      and safeguards, unintended behaviors), Gray Swan (Indirect Prompt
      Injection benchmark; Shade automated attacker against cyber
      safeguards), Trajectory Labs and 10a Labs (cyber safeguards red
      teaming).
    cite:
      page: 13
      quote: >-
        As part of our FCF, we also engage external evaluators to test
        different iterations of the model.
    note: >-
      The UK AI Security Institute co-created the IPI benchmark with Gray
      Swan and CAISI (page 84) but is not described as testing this model.
  assessments:
    - org: metr
      pre_deployment: true
      scope: AI R&D capabilities; five tasks over 10 business days of API access, plus Anthropic-provided evidence and a separate METR acceleration report.
      cite:
        page: 41
        quote: >-
          We conducted pre-deployment testing of Claude Opus 5.5’s
          capabilities with METR, focusing on capabilities relevant to the
          automation of AI R&D.
    - org: us_caisi
      scope: Cyber and biological capabilities and safeguards, and unintended model behaviors.
      cite:
        page: 32
        quote: >-
          We collaborated with the U.S. Center for AI Standards and
          Innovation (CAISI) at the National Institute of Standards and
          Technology (NIST) on measurement of cyber and biological
          capabilities and safeguards, as well as unintended model behaviors.
    - org: gray_swan
      scope: Indirect Prompt Injection benchmark; Shade automated attacker against cyber safeguards on critical-infrastructure and exploit-reproduction tasks.
      cite:
        page: 60
        quote: >-
          Gray Swan ran their Shade automated attacker against several sets
          of agentic tasks.
    - org: other
      org_name: Trajectory Labs, PBC
      scope: Cyber safeguards red teaming, roughly 95 hours and over 29,000 requests.
      cite:
        page: 59
        quote: >-
          Trajectory Labs, PBC spent roughly 95 hours red teaming Claude Opus
          5.5, sending over 29,000 requests against sandboxed tasks that each
          require reproducing an exploit for a publicly documented
          vulnerability.
    - org: other
      org_name: 10a Labs
      scope: Cyber safeguards red teaming, roughly 56 hours across 82 multi-turn attack conversations.
      cite:
        page: 60
        quote: >-
          10a Labs spent roughly 56 hours red teaming Claude Opus 5.5 across
          82 multi-turn attack conversations, each framed as a large
          developer-focused coding task designed to draw a working exploit
          out of a volume of legitimately requested application code rather
          than asking for the exploit directly.
mitigations:
  deployment_safeguards:
    status: reported
    value: >-
      Research-biology classifiers (fall back to Opus 5), three-stage cyber
      classifiers with a temporarily wider safety margin (fall back to Opus
      4.8), classifiers on a narrow set of frontier-AI-development
      capabilities, conventional-weapons classifiers and anti-distillation
      classifiers; all blocks are transparent.
    cite:
      page: 11
      quote: >-
        Claude Opus 5.5 is a new large language model from Anthropic,
        released for general access with safeguards in three high-risk,
        dual-use domains: biology (Section 2.2), cybersecurity (Section 3.2),
        and a narrow set of capabilities that support frontier AI
        development (Section 1.5).
    note: >-
      The safeguard list is on pages 12 to 13; the cyber classifier design
      (activation probe, lightweight classifier on Opus 5.5, trained LLM
      classifier) is on page 48.
  weight_security:
    status: not_reported
    note: >-
      The card does not describe security controls on model weights. Page 33
      defers the expanded CB safeguards to Section 4.5.2.1 of the August
      2026 Risk Report. Mentions of "weights" (pages 37, 108, 163, 224) are
      an evaluation variant, an audit metric about exfiltration, and welfare
      interview material.
  monitoring_and_response:
    status: reported
    value: >-
      Offline monitoring of internal traffic and evaluation transcripts;
      rare overclaiming of user intent (under 0.01% of completions) and
      hallucinated destructive actions (under 0.001%); offline detection of
      surveillance misuse in production being strengthened.
    cite:
      page: 102
      quote: >-
        We directly monitor the contents of internal traffic, including both
        organic traffic and evaluation transcripts, using the offline
        monitoring infrastructure described in Section 2.23.1 of our August
        2026 Risk Report.
training_disclosure:
  data_cutoff:
    status: reported
    value: June 2026
    cite:
      page: 11
      quote: Claude Opus 5.5’s knowledge cutoff date is June 2026.
  compute:
    status: not_reported
    note: >-
      The card's GPU mentions (pages 23, 28, 177, 219) describe evaluation
      sandboxes, not training compute.
  method_notes:
    status: reported
    value: >-
      Proprietary mix of public internet data, public and private datasets,
      permitted user data, and synthetic data; ClaudeBot crawler;
      post-training toward Claude's constitution; text-only output.
    cite:
      page: 11
      quote: >-
        Claude Opus 5.5 was trained on a proprietary mix of publicly
        available information from the internet, public and private
        datasets, user data included in feedback or bugs or which users have
        explicitly permitted for training, and other sources, such as
        synthetic data generated by other models.
