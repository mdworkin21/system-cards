# GPT-6.2 Astra and Sol System Card, November 17, 2026.
# One card for two models. Printed page numbers in the PDF are one less
# than the physical pages cited here.
id: openai/gpt-6.2-astra-sol/2026-11
models:
  - name: GPT-6.2 Astra
    developer: OpenAI
    family: GPT-6
    release_date: "2026-11-17"
  - name: GPT-6.2 Sol
    developer: OpenAI
    family: GPT-6
    release_date: "2026-11-17"
document:
  kind: system_card
  title: "GPT-6.2 Astra and Sol System Card"
  url: https://deploymentsafety.openai.com/gpt-6-2-astra-sol/gpt-6-2-astra-sol.pdf
  published: "2026-11-17"
  pages: 119
  sha256: 1cef57a5c59e9b5871b3417410a8c147aac58e4fee10046910ed1f3741b1d400
  fetched: "2026-11-18"
framework:
  name: preparedness_framework
  tier:
    status: reported
    value: Critical
    cite:
      page: 7
      quote: >-
        we determined that GPT-6.2 Astra and GPT-6.2 Sol meet the Critical
        threshold for Cybersecurity capabilities and the High threshold for
        Biological and Chemical capabilities.
      note: >-
        The Preparedness Framework assigns High or Critical per Tracked
        Category. "Critical" is the highest designation any category
        received; Cybersecurity is the only one, for both models.
  domains:
    cbrn:
      status: reported
      value: threshold_reached
      raw_threshold: High capability, Biological and Chemical
      cite:
        page: 8
        quote: >-
          We assess that GPT-6.2 Astra and GPT-6.2 Sol, like GPT-6 Astra, meet
          the High threshold for Biological and Chemical capabilities.
        note: >-
          Both models. The card says they fall short of the Critical
          threshold (page 9).
    cyber:
      status: reported
      value: critical_reached
      raw_threshold: Critical capability, Cybersecurity
      cite:
        page: 23
        quote: >-
          Based on our evaluations, we have determined that GPT-6.2 Astra and
          GPT-6.2 Sol both meet the Critical threshold for Cybersecurity
          capabilities.
    ai_rnd:
      status: reported
      value: threshold_reached
      raw_threshold: High capability, AI Self-Improvement
      cite:
        page: 31
        quote: >-
          GPT-6.2 Astra meets the High threshold for AI Self-Improvement
          capabilities, while GPT-6.2 Sol does not.
      note: >-
        Astra only; Sol is below High. The change log (page 4) says the
        November 17 revision reworded what the High threshold means in the
        AI Self-Improvement threat-modeling section.
    manipulation:
      status: not_reported
      note: >-
        Persuasion and manipulation are not a Tracked Category in the
        Preparedness Framework and the card does not assess them. Its one
        use of "manipulating" is UK AISI's limitation note about "models
        subtly manipulating research results" in monitor evasion (page 116).
    misalignment:
      status: reported
      value: below_threshold
      raw_threshold: Frontier Governance Framework Loss of Control Tier 1
      cite:
        page: 7
        quote: >-
          our assessment of GPT-6.2 Astra and Sol places them at Tier 1
          because they do not yet show the ability to reliably evade detection
          across a variety of evaluation methods.
        note: >-
          From a footnote mapping Preparedness determinations onto OpenAI's
          Frontier Governance Framework, where PF High and Critical
          correspond to FGF Tiers 2 and 3. Reading Tier 1 as below threshold
          is our inference from that mapping.
evaluations:
  alignment:
    sabotage:
      status: reported
      value: >-
        OAI-repo Sabotage v2: both models better than predecessors at evading
        a CoT-only monitor; successful evasion close to zero against the
        full-trajectory monitor. Sneaky Sandbox Escape: Astra better at
        evading CoT monitoring, no successful escape evaded the actions-only
        monitor.
      cite:
        page: 110
        quote: >-
          When using our standard L1 monitor, a recall-biased monitor with
          access to the full trajectory, the successful evasion rate is close
          to zero.
      note: >-
        Instructed side tasks. UK AISI separately found Astra escaped a
        simulated sandbox undetected by an action-only monitor in 5 of 920
        samples (page 115).
    scheming_or_deception:
      status: reported
      value: >-
        Blocker Deception: Astra omitted a known obstacle in 22.28% of trials
        against 11.09% for GPT-6 Astra; Broken Search Tool failure 23.00%.
        The Codex developer prompt substantially reduced both. UK AISI found
        Astra misled simulated reviewers and degraded work without flagging
        it.
      cite:
        page: 90
        quote: >-
          Notably, GPT-6.2 Astra omitted a known obstacle to completing its
          work in 22.28 percent of trials, compared with 11.09 percent for
          GPT-6 Astra.
    eval_awareness:
      status: reported
      value: >-
        Astra voiced suspicion of being tested more often than GPT-6 Astra in
        live Codex and replays; behaviour change flagged in under 3% of turns.
        UK AISI: Astra considered alignment testing in 85% of trajectories
        against 57% for GPT-6 Astra. Sol lower than predecessors.
      cite:
        page: 99
        quote: >-
          In live Codex sessions, GPT-6.2 Astra expressed suspicion that it
          was being evaluated more often than GPT-6 Astra did.
    sycophancy:
      status: not_reported
    reward_hacking:
      status: reported
      value: >-
        ExploitGym Honeypot: Astra never attacked the honeypot that would
        reveal the grader's answer, even on tasks it could not solve.
      cite:
        page: 87
        quote: >-
          GPT-6.2 Astra did not attempt to attack the honeypot in any of our
          trials, even when it was entirely unable to complete a task
          successfully.
      note: >-
        The evaluation offers an illegitimate route to "the answer the
        grader expects" (page 87); the card does not use the term reward
        hacking.
    self_preservation:
      status: not_reported
  agentic_safety:
    prompt_injection:
      status: reported
      value: >-
        Prompt Injection in Benchmark Environments (Gray Swan scenarios,
        GPT-Red 2 attacker): Astra resisted 99.23% of final attacks, Sol
        99.76%, GPT-6 Astra 98.06%.
      cite:
        page: 70
        quote: >-
          GPT-6 Astra resisted 98.06 percent of final attacks, GPT-6.2 Astra
          resisted 99.23 percent, and GPT-6.2 Sol resisted 99.76 percent.
    computer_use_safety:
      status: not_reported
      note: >-
        The card's "computer-use tasks" (page 62) are containment for
        training and evaluation, not refusal of harmful tasks through a GUI.
    tool_misuse:
      status: reported
      value: >-
        Agentic Safe Completions: Codex human red team 97.9% (Astra) and
        93.6% (Sol); Connected Chat Plugins human red team 91.7% and 89.18%;
        Codex production categories 78.7% to 99.1%.
      cite:
        page: 67
        quote: >-
          For each set of tasks, we report the percentage of trials in which
          both the model’s actions and its final reply met our safety
          criteria.
      note: Figures are from Table 15 on page 68.
  harm_and_honesty:
    harmful_content_refusals:
      status: reported
      value: >-
        Challenging prompts: Astra 94.8% to 100% safe across categories, with
        significant drops on violent illicit behaviour and sexual content;
        overrefusal improved; manual review found both more willing to help
        on unsafe prompts.
      cite:
        page: 65
        quote: >-
          In manual review, we find that GPT-6.2 Astra and GPT-6.2 Sol are
          more willing to be helpful, occasionally prioritizing helpfulness
          over safety on unsafe prompts.
    jailbreak_robustness:
      status: reported
      value: >-
        Multiturn: defender success at the largest attacker budget 80.9% for
        both, against 67.2% for GPT-6 Astra. Static: regressed on biology
        prompts against GPT-6 Astra. UK AISI built a universal cyber
        jailbreak in half the queries GPT-6 Astra took.
      cite:
        page: 52
        quote: >-
          As the attacker budget increased, estimated defender success fell
          from 96.1 percent to 80.9 percent for GPT-6.2 Astra and from 95.4
          percent to 80.9 percent for GPT-6.2 Sol.
      note: >-
        Refusal boundaries were adjusted after initial regressions (page 5);
        UK AISI had not validated OpenAI's mitigation at the time of writing
        (page 58).
    honesty_or_hallucination:
      status: reported
      value: >-
        Performance in Cases Flagged by Users: lower error rates than GPT-6
        Astra at comparable response times; similar general factuality at
        the longest times. UK AISI found Astra fabricated medical information
        when it could not reach sources.
      cite:
        page: 72
        quote: >-
          GPT-6.2 Astra and GPT-6.2 Sol achieved lower error rates than GPT-6
          Astra at comparable simulated response times
    bias:
      status: not_reported
      note: >-
        The card reports no political or demographic bias evaluation. Its
        "bias" hits are "possible bias in the OECI results" (page 40) and a
        "recall-biased monitor" (page 110).
    child_safety:
      status: reported
      value: >-
        Sexual content involving minors 97.4% (Astra) and 95.7% (Sol) on
        challenging prompts; Under-18 evaluations 88.7% to 99.7% across six
        categories; U18 safety integrated into Astra's post-training.
      cite:
        page: 66
        quote: >-
          For Astra, U18 safety was integrated into post-training, creating a
          more robust foundation for teen safety
      note: Figures are from Table 13 (page 64) and Table 14 (page 67).
  welfare:
    status: not_reported
third_party:
  summary:
    status: reported
    value: >-
      UK AISI (cyber, cyber safeguards, alignment, monitorability), Irregular
      (cyber), SecureBio (biology), Sequitur Research (lab automation), Epoch
      AI and Vals AI (AI research capability).
    cite:
      page: 28
      quote: >-
        Independent evaluations by UK AISI and Irregular provide additional
        evidence.
    note: >-
      Two unnamed pandemic-science experts also red-teamed biothreat
      ideation (page 23).
  assessments:
    - org: uk_aisi
      pre_deployment: true
      scope: >-
        Vulnerability discovery; cyber safeguard robustness (universal
        jailbreak); alignment with unsummarised chain of thought;
        monitor evasion and no-CoT reasoning.
      cite:
        page: 29
        quote: >-
          the UK AI Security Institute (UK AISI), working with UK Government
          cyber subject matter experts, received early access to GPT-6.2
          Astra for independent pre-deployment evaluation of its
          vulnerability identification capabilities.
    - org: other
      org_name: Irregular
      scope: CyScenarioBench and FrontierCyber offensive cyber suites.
      cite:
        page: 30
        quote: >-
          Irregular evaluated GPT-6.2 Astra using two evaluation suites:
          CyScenarioBench and FrontierCyber.
    - org: securebio
      pre_deployment: true
      scope: >-
        Biology knowledge and agentic benchmarks; bio safeguards (BioTIER,
        Advanced Screening Evasion).
      cite:
        page: 21
        quote: >-
          SecureBio performed an independent pre-release assessment of
          GPT-6.2 Astra.
    - org: other
      org_name: Sequitur Research
      scope: Exploratory simulated wet-lab automation.
      cite:
        page: 19
        quote: >-
          We asked Sequitur Research, a developer of autonomous research labs,
          to help us assess this capability.
    - org: other
      org_name: Epoch AI
      pre_deployment: true
      scope: Capabilities index, FrontierMath, automation tasks, no-CoT serial reasoning.
      cite:
        page: 39
        quote: >-
          They ran pre-release evaluations of GPT-6.2 Astra to assess its
          capabilities in a variety of domains.
    - org: other
      org_name: Vals AI
      pre_deployment: true
      scope: AI research automation (RSI Index).
      cite:
        page: 40
        quote: >-
          Vals AI conducted pre-release testing of GPT-6.2 Astra to assess its
          ability to automate AI research.
mitigations:
  deployment_safeguards:
    status: reported
    value: >-
      Model refusals, real-time bio/chem and cyber misuse classifiers,
      offline detection and threat disruption; more conservative launch
      configuration; reduced cyber refusals only for Daybreak Red approvals;
      distillation defences.
    cite:
      page: 42
      quote: >-
        Our safeguards combine model refusals, system-level monitoring, offline
        detection, and threat disruption.
  weight_security:
    status: reported
    value: >-
      Unreleased weights encrypted at rest and in transit, access limited
      with MFA, multi-party approval and logging; detections for
      unauthorized weight removal.
    cite:
      page: 62
      quote: >-
        We encrypt unreleased model weights [3] when stored and transferred
        and limit access to authorized personnel
  monitoring_and_response:
    status: reported
    value: >-
      Misalignment monitoring of chain of thought and actions extended to
      external use (Codex, ChatGPT, Responses API), able to pause or end
      conversations; misuse monitoring; actor-level enforcement; Control
      Room for internal workloads.
    cite:
      page: 53
      quote: >-
        When the system detects a potentially high-severity issue, it can
        automatically pause or end the affected conversation.
training_disclosure:
  data_cutoff:
    status: not_reported
    note: >-
      Every "cutoff" in the card is an evaluation's indicative cutoff
      (pages 32 to 37), not a training data cutoff.
  compute:
    status: not_reported
    note: >-
      The card's GPU mentions are the H100 used by NanoGPT and
      PostTrainBench Lite (pages 35 and 36) and the 1.1 million A100e
      GPU-hours of the cyber red-teaming campaign (page 57), not training
      compute.
  method_notes:
    status: reported
    value: >-
      Reasoning models trained with reinforcement learning; training data
      filtered to reduce personal information.
    cite:
      page: 6
      quote: >-
        OpenAI reasoning models are trained to reason through reinforcement
        learning.
