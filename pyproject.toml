[project]
name = "system-cards"
version = "0.1.0"
description = "What frontier model system cards actually say about safety, compared side by side and cited to the page."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6",
    "click>=8.2",
    "pymupdf>=1.26",
]

[project.scripts]
syscards = "system_cards.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.19",
    "pytest>=8.4",
    "pytest-socket>=0.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_cards"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"src/system_cards/cli.py" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --disable-socket"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["system_cards.pdftext", "system_cards.fetch"]
disallow_untyped_calls = false
